<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Агент</title>
<script>
  // Тема до первой отрисовки — иначе тёмная тема мигает светлой при загрузке.
  try { const t = localStorage.getItem("agent_theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}
</script>

</head>

<div id="login" class="login" hidden>
  <form id="login-form" class="login-card">
    <div class="logo-mark" aria-hidden="true"></div>
    <h1 id="login-title">Агент</h1>
    <p class="muted">Войдите по токену доступа</p>
    <input id="token-input" type="password" autocomplete="current-password" placeholder="Токен" required>
    <button class="btn primary block" type="submit">Войти</button>
    <p id="login-error" class="error-text" role="alert"></p>
  </form>
</div>

<div id="app" class="app" hidden>
  <aside id="sidebar" class="sidebar">
    <div class="side-head">
      <div class="brand"><span class="logo-mark sm" aria-hidden="true"></span><span id="app-name">Агент</span></div>
      <button id="new-chat" class="icon-btn" title="Новый разговор (Ctrl+K)" aria-label="Новый разговор"><svg><use href="#i-plus"/></svg></button>
    </div>
    <label class="search"><svg><use href="#i-search"/></svg><input id="session-filter" placeholder="Поиск по разговорам"></label>
    <nav id="sessions" class="sessions" aria-label="Разговоры"></nav>
    <div class="user-wrap">
      <button id="user-btn" class="user-btn" type="button" aria-haspopup="menu" aria-expanded="false">
        <span class="avatar" id="me-avatar"></span>
        <span class="user-lines"><span id="me-name" class="me-name"></span><span id="me-plan" class="me-plan"></span></span>
        <svg class="chev-ud"><use href="#i-updown"/></svg>
      </button>
      <div id="user-menu" class="menu" role="menu" hidden>
        <div class="menu-head" id="menu-id"></div>
        <button class="menu-item" role="menuitem" data-settings="general"><svg><use href="#i-gear"/></svg>Настройки<kbd>Ctrl ,</kbd></button>
        <button class="menu-item" role="menuitem" data-settings="plan"><svg><use href="#i-card"/></svg>Подписка<span id="menu-plan" class="menu-aside"></span></button>
        <button class="menu-item" role="menuitem" data-settings="usage"><svg><use href="#i-chart"/></svg>Расход</button>
        <div class="menu-sep"></div>
        <div class="menu-theme" role="group" aria-label="Тема">
          <button data-theme-set="auto" title="Как в системе"><svg><use href="#i-auto"/></svg></button>
          <button data-theme-set="light" title="Светлая"><svg><use href="#i-sun"/></svg></button>
          <button data-theme-set="dark" title="Тёмная"><svg><use href="#i-moon"/></svg></button>
        </div>
        <a id="menu-help" class="menu-item" role="menuitem" target="_blank" rel="noopener" hidden><svg><use href="#i-help"/></svg>Помощь</a>
        <div class="menu-sep"></div>
        <button class="menu-item" role="menuitem" id="logout"><svg><use href="#i-logout"/></svg>Выйти</button>
      </div>
    </div>
  </aside>
  <div id="scrim" class="scrim" hidden></div>

  <main class="main">
    <header class="top">
      <button id="menu" class="icon-btn only-mobile" aria-label="Меню"><svg><use href="#i-menu"/></svg></button>
      <div class="title-wrap"><button id="crumb" class="crumb" type="button" hidden><svg><use href="#i-folder"/></svg><span></span></button><h2 id="chat-title" class="chat-title">Новый разговор</h2><button id="device-chip" class="pc-ind" type="button" aria-haspopup="true" aria-expanded="false" hidden><svg><use href="#i-monitor"/></svg><i></i></button></div>
      <div class="controls">
        <span id="cost" class="cost" title="Стоимость разговора"></span>
        <button id="toggle-tasks" class="icon-btn" title="Задачи агента" aria-label="Задачи"><svg><use href="#i-tasks"/></svg><span id="tasks-count" class="count" hidden></span></button>
      </div>
    </header>

    <section id="page" class="page" hidden></section>
    <section id="messages" class="messages" aria-live="polite"></section>

    <div class="composer-wrap">
      <button id="to-bottom" class="to-bottom" type="button" title="К последнему сообщению" aria-label="К последнему сообщению" hidden><svg><use href="#i-down"/></svg></button>
      <form id="composer" class="composer">
        <div id="attachments" class="attachments" hidden></div>
        <textarea id="input" rows="1" placeholder="Сообщение…" aria-label="Сообщение"></textarea>
        <div class="composer-bar">
          <input id="file" type="file" multiple hidden>
          <button id="attach" class="icon-btn" type="button" title="Прикрепить файл — можно перетащить или вставить из буфера" aria-label="Прикрепить"><svg><use href="#i-clip"/></svg></button>
          <button id="model-btn" class="select picker-btn" type="button" title="Модель" aria-haspopup="listbox" aria-expanded="false"><span id="model-name">…</span></button>
          <button id="mode-btn" class="select picker-btn mode-btn" type="button" title="Права агента" aria-haspopup="listbox" aria-expanded="false"><svg class="lead" id="mode-icon"><use href="#i-ask"/></svg><span id="mode-name">…</span></button>
          <span id="hint" class="hint">Enter — отправить · Shift+Enter — перенос</span>
          <button id="stop" class="send stop" type="button" title="Остановить" aria-label="Остановить" hidden><svg><use href="#i-stop"/></svg></button>
          <button id="send" class="send" type="submit" title="Отправить" aria-label="Отправить"><svg><use href="#i-send"/></svg></button>
        </div>
      </form>
    </div>
    <div id="below" class="below" hidden></div>
  </main>

  <aside id="preview" class="preview" hidden aria-label="Предпросмотр файла">
    <div class="pv-resize" id="pv-resize" title="Потяните, чтобы изменить ширину"></div>
    <div class="pv-head">
      <span class="pv-icon" id="pv-icon"></span>
      <div class="pv-title"><b id="pv-name"></b><small id="pv-meta"></small></div>
      <button id="pv-download" class="icon-btn" type="button" title="Скачать" aria-label="Скачать"><svg><use href="#i-download"/></svg></button>
      <button id="pv-close" class="icon-btn" type="button" title="Закрыть" aria-label="Закрыть предпросмотр"><svg><use href="#i-x"/></svg></button>
    </div>
    <div id="pv-body" class="pv-body"></div>
  </aside>

  <aside id="tasks" class="tasks" hidden>
    <div class="tasks-head"><h4><svg><use href="#i-tasks"/></svg>Задачи</h4><span id="tasks-progress" class="muted"></span>
      <button id="tasks-close" class="icon-btn" type="button" title="Скрыть" aria-label="Скрыть задачи"><svg><use href="#i-x"/></svg></button></div>
    <div class="progress"><i id="tasks-bar"></i></div>
    <ol id="todo-list" class="todo-list"></ol>
  </aside>
</div>

<div id="settings" class="modal" hidden>
  <div class="modal-card settings" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <nav class="settings-nav" id="settings-nav" aria-label="Разделы настроек">
      <h2 id="settings-title">Настройки</h2>
      <button data-tab="general"><svg><use href="#i-user"/></svg>Общие</button>
      <button data-tab="models"><svg><use href="#i-cube"/></svg>Модели</button>
      <button data-tab="memory"><svg><use href="#i-memory"/></svg>Память</button>
      <button data-tab="tools"><svg><use href="#i-tools"/></svg>Инструменты</button>
      <button data-tab="skills"><svg><use href="#i-book"/></svg>Навыки</button>
      <button data-tab="computer"><svg><use href="#i-monitor"/></svg>Компьютер</button>
      <button data-tab="schedules"><svg><use href="#i-clock"/></svg>Расписание</button>
      <button data-tab="usage"><svg><use href="#i-chart"/></svg>Расход</button>
      <button data-tab="plan"><svg><use href="#i-card"/></svg>Подписка</button>
      <button data-tab="account"><svg><use href="#i-shield"/></svg>Аккаунт</button>
    </nav>
    <section class="settings-main">
      <header class="settings-head"><h3 id="tab-title"></h3><button id="settings-close" class="icon-btn" aria-label="Закрыть"><svg><use href="#i-x"/></svg></button></header>
      <div id="tab-body" class="settings-body"></div>
    </section>
  </div>
</div>

<div id="popover" class="menu popover" role="menu" hidden></div>
<div id="model-pop" class="menu model-pop" role="dialog" aria-label="Выбор модели" hidden></div>
<div id="mode-pop" class="menu mode-pop" role="listbox" aria-label="Права агента" hidden></div>

<script src="/static/viz.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
