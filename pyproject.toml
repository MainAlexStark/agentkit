[project]
name = "agentkit"
version = "0.2.0"
description = "Ядро агента (harness): цикл, инструменты, MCP, права, хуки, контекст, память, skills, субагенты, трейсы, evals"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Alex Stark", email = "mainalexstark@gmail.com" }]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "jsonschema>=4.21",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "pyyaml>=6.0",
    "croniter>=2.0",
]

[project.optional-dependencies]
# Сервис: всё, что нужно шаблону template/ поверх ядра.
service = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic-settings>=2.2",
    "asyncpg>=0.29",
    "python-multipart>=0.0.9",  # загрузка файлов в чат
    "redis>=5.0",               # несколько процессов (AGENT_REDIS_URL)
    "pypdf>=4.0",               # текст из PDF-вложений
    "python-docx>=1.1",         # текст из DOCX-вложений
    "openpyxl>=3.1",            # текст из XLSX-вложений
    "pillow>=10.0",             # уменьшение картинок для модели
]
otel = ["opentelemetry-api>=1.24", "opentelemetry-sdk>=1.24"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4"]

[project.scripts]
agentkit = "agentkit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentkit"]

# Шаблон сервиса едет внутри пакета: `agentkit new` работает и без клона репозитория.
[tool.hatch.build.targets.wheel.force-include]
"template" = "agentkit/_template"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]  # шаблон тестируется отдельно: cd template && pytest

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]
