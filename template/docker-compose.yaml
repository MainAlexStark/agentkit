# Развёртывание на VPS: агент, база и TLS одной командой.
#
#   ./deploy.sh agent.example.com
#

name: agent-service

services:
  agent-service:
    build:
      context: .
      args:
        VERSION: ${VERSION:-docker}
    container_name: agent-service
    restart: unless-stopped
    env_file:
      - ./deploy/agent-service.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Рабочие папки сессий, файлы агента, трейсы. База — отдельно, в postgres.
      - data:/srv/data
    # Наружу не выставлен: снаружи виден только общий Caddy по mcp-network.
    expose:
      - "8080"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks:
      - mcp-network
      - internal
      - sandbox

  # Песочница для run_python / run_bash: сеть без выхода наружу, без секретов и базы.
  # С агентом делит только рабочие папки разговоров (подпапка workspaces тома data).
  sandbox:
    build:
      context: .
      dockerfile: deploy/sandbox.Dockerfile
    container_name: agent-service-sandbox
    restart: unless-stopped
    env_file:
      - ./deploy/sandbox.env
    depends_on:
      agent-service:
        condition: service_healthy
    volumes:
      - type: volume
        source: data
        target: /work
        volume:
          subpath: workspaces
    read_only: true
    tmpfs:
      - /tmp
      - /home/sandbox
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 3g
    cpus: 2
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks:
      - sandbox

  postgres:
    image: postgres:16-alpine
    container_name: agent-service-postgres
    restart: unless-stopped
    # Отдельный env: базе незачем видеть ключи моделей и токены.
    env_file:
      - ./deploy/postgres.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 5s
      retries: 20
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks:
      - internal

  # Шина между процессами агента (AGENT_WORKERS > 1): блокировки прогонов,
  # живые события, отмена. Данные не хранит — после перезапуска ей нечего терять.
  redis:
    image: redis:7-alpine
    container_name: agent-service-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks:
      - internal

volumes:
  data:
  pgdata:

networks:
  mcp-network:
    external: true
  internal:
  # internal: true — у песочницы нет выхода в интернет.
  sandbox:
    internal: true
