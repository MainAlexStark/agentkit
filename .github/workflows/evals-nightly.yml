name: evals-nightly
# Набор evals/harness на живых моделях: ночью и по кнопке. Нужен секрет OPENROUTER_API_KEY.
# Итог — таблица в сводке job, отчёт JSON и журналы упавших прогонов (agentkit replay) в артефактах.
on:
  schedule:
    - cron: "17 1 * * *"   # 04:17 по Москве
  workflow_dispatch:
    inputs:
      models:
        description: "Модели через пробел"
        default: "openrouter:anthropic/claude-sonnet-4.5 openrouter:anthropic/claude-haiku-4.5"
      repeat:
        description: "Повторов каждого кейса"
        default: "2"
jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AGENT_OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      AGENT_MODEL_SMALL: openrouter:anthropic/claude-haiku-4.5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - name: evals
        run: |
          MODELS="${{ github.event.inputs.models || 'openrouter:anthropic/claude-sonnet-4.5 openrouter:anthropic/claude-haiku-4.5' }}"
          ARGS=""
          for m in $MODELS; do ARGS="$ARGS --model $m"; done
          agentkit eval evals/harness --app agentkit.bench:make_agent $ARGS \
            --repeat "${{ github.event.inputs.repeat || '2' }}" --parallel 8 --timeout 300 \
            --baseline evals/baseline.json --json evals-out.json --md "$GITHUB_STEP_SUMMARY" \
            --save-runs evals-runs --min-pass-rate 0.85
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evals-${{ github.run_id }}
          path: |
            evals-out.json
            evals-runs/
          retention-days: 30
