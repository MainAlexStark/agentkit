name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[service,dev]"
      - run: ruff check src tests template/app template/tests
      - run: pytest -q
      - run: cd template && pytest -q
      - run: cd template && agentkit eval evals/ --app app.evals:make_agent --offline
      # Шаблон должен разворачиваться в рабочий проект.
      - run: |
          agentkit new ci-agent --dest /tmp
          cd /tmp/ci-agent && pip install -r requirements.txt && pytest -q
